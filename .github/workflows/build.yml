name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build Fabric mod
        run: gradle --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Mod
          path: build/libs/*.jar
          if-no-files-found: error

  launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build launcher
        working-directory: launcher
        run: gradle --no-daemon installDist
      - name: Package Windows app
        run: >
          jpackage --type app-image --dest launcher-dist --name Nocturne
          --input launcher/build/install/nocturne-launcher/lib
          --main-jar nocturne-launcher-1.0.0.jar
          --main-class com.nocturne.launcher.LauncherApp
      - name: Zip Windows app
        run: Compress-Archive -Path launcher-dist\Nocturne -DestinationPath Nocturne-Windows.zip
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Windows
          path: Nocturne-Windows.zip
          if-no-files-found: error

  release:
    needs: [mod, launcher]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: Nocturne-Mod
          path: release-assets
      - name: Download launcher artifact
        uses: actions/download-artifact@v4
        with:
          name: Nocturne-Windows
          path: release-assets
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: release-assets/*
