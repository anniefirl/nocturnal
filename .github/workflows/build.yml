
name: Build Nocturne Client

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'

      - name: Build Nocturne
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-client-build
          path: build/libs/*.jar
          if-no-files-found: error
